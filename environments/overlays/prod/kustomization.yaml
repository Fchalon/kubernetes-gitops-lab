apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:

  - ../../base

namespace: formation-prod

labels:

  - pairs:
      environment: prod
    includeSelectors: true
    includeTemplates: true

namePrefix: prod-

replicas:

  - name: nginx
    count: 5

images:

  - name: nginx
    newTag: "1.28"

patches:

  - path: deployment-patch.yaml
