apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:

  - ../../base

namespace: formation-dev

labels:

  - pairs:
      environment: dev
    includeSelectors: true
    includeTemplates: true

namePrefix: dev-

replicas:

  - name: nginx
    count: 2

images:

  - name: nginx
    newTag: "1.28"

patches:

  - path: patch_deployment_dev.yaml
