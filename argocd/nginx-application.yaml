apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nginx-formation
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Fchalon/kubernetes-gitops-lab.git
    targetRevision: main
    path: apps/nginx

  destination:
    server: https://kubernetes.default.svc
    namespace: formation-gitops

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
