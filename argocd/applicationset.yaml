apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet

metadata:
  name: nginx-environments
  namespace: argocd

spec:

  generators:

    - list:

        elements:

          - env: dev

          - env: prod

  template:

    metadata:
      name: 'nginx-{{env}}'

    spec:

      project: formation

      source:
        repoURL: https://github.com/Fchalon/kubernetes-gitops-lab.git
        targetRevision: main
        path: 'environments/overlays/{{env}}'

      destination:
        server: https://kubernetes.default.svc
        namespace: 'formation-{{env}}'

      syncPolicy:

        automated:
          enabled: true
          prune: true
          selfHeal: true

        syncOptions:
          - CreateNamespace=true
